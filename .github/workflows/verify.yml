name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 PR(브랜치)에 새 커밋이 올라오면 진행 중인 이전 실행은 취소한다.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint · typecheck · build · e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # package.json의 packageManager(pnpm@12.x)를 읽어 같은 버전을 설치한다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --reporter=github: 오류를 PR 코드 라인에 주석(annotation)으로 표시한다.
      - name: Lint
        run: pnpm lint:biome --reporter=github

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Linux 러너에서는 브라우저 실행에 필요한 시스템 라이브러리도 함께 설치한다.
      - name: Install Playwright browsers
        run: pnpm test:e2e:install --with-deps

      - name: E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
